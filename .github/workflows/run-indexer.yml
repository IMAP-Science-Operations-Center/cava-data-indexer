name: Run Indexer

on:
  push:
    branches: [ "main" ]
  schedule:
  - cron: '55 * * * *'

permissions:
  contents: write

jobs:
  run_indexer:
    environment: Development
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: ./.github/workflows/base-run-indexer.yml
      with:
        environment: Development
        api_key: ${{secrets.IMAP_API_KEY}}


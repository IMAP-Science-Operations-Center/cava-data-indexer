[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data_indexer"
version = "0.0.18"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "spacepy>=0.7.0",
    "httpx>=0.23.0",
    "imap-data-access==0.42.0.dev0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N"]
ignore = ["N802"]
